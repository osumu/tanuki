<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>たぬきの運命</title>
    <style>
        @font-face {
            font-family: 'PixelMplus';
            src: url('PixelMplus12-Regular.ttf') format('truetype');
        }


        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #111;
            font-family: 'PixelMplus', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes rainbow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .screen {
            width: 100vw;
            height: 100vh;
        }

        #startScreen {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            background: #ffffff !important;
        }

        /* 右上の保存ボタン */
        .save-trigger-btn {
            display: block;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            font-family: 'PixelMplus', sans-serif;
            background: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }

        .save-trigger-btn:hover {
            background: #ffd700;
            color: #111;
        }

        /* 保存完了メッセージのポップアップ */
        #save-toast {
            position: fixed;
            top: 50px;
            right: 10px;
            z-index: 1001;
            background: rgba(0, 128, 0, 0.9);
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'PixelMplus', sans-serif;
            display: none;
            animation: fadeinout 2s forwards;
        }

        @keyframes fadeinout {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }

            15% {
                opacity: 1;
                transform: translateY(0);
            }

            85% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        #titleScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff !important;
            z-index: 4000;
            justify-content: center;
            align-items: center;
        }

        .img-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        .img-wrapper img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            border: none;
        }

        #HowToPlayScreen,
        #SettingsScreen {
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: #111111;
            color: #ffffff;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .sub-title {
            font-size: clamp(24px, 4vw, 36px);
            color: #ffd700;
            margin-bottom: 24px;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 8px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        #battleScreen {
            display: none;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #000000;
        }

        /* 全体の外枠のみ指定 */
        .battle-container {
            width: 90%;
            max-width: 600px;
            height: 90vh;
            border: 2px solid #000000;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #ffffff;
        }

        .battle-dialog-box {
            height: 70px;
            position: relative;
            background: #ffffff;
        }


        .battle-items-box {
            width: 35%;
            font-size: 13px;
            overflow-y: auto;
        }

        .battle-image-container {
            border: 2px solid #000000;
            padding: 12px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #ffffff;
        }

        .battle-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 下段：選択 */
        .battle-choices-box {
            height: 100px;
            font-size: 14px;
            overflow-y: auto;
        }

        .panel-title {
            font-weight: bold;
            margin-bottom: 4px;
        }

        #battleItemList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #battleItemList li {
            margin-bottom: 2px;
        }

        .next-mark {
            position: absolute;
            right: 0;
            bottom: 0;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .content-box {
            width: 100%;
            max-width: 500px;
            background: #222222;
            border: 2px solid #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: clamp(14px, 2.5vw, 18px);
            line-height: 1.6;
        }

        .content-box h3 {
            margin-top: 0;
            color: #a9a9a9;
            font-size: clamp(16px, 3vw, 20px);
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .setting-btn-group {
            display: flex;
            gap: 8px;
        }

        .back-btn,
        .config-btn {
            font-family: 'PixelMplus', sans-serif;
            background: #ffffff;
            color: #111111;
            border: 2px solid #ffffff;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        .config-btn.active {
            background: #ffd700;
            border-color: #ffd700;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #ffd700;
            border-color: #ffd700;
        }

        #gameClearScreen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #ffffff, #dddddd);
        }

        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000 !important;
            z-index: 5000;
            margin: 0;
            padding: 0;
            display: none;
            justify-content: center;
            align-items: center;
        }

        area {
            cursor: pointer;
        }

        .cleartext {
            font-size: clamp(32px, 6vw, 72px);
            margin-bottom: 30px;
            color: #7d7d05;
        }

        #gameScreen {
            display: none;
            flex-direction: column;
        }

        .image-container {
            width: 100%;
            height: 65vh;
            background: #eaeaea;
            border-bottom: 4px solid #111;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .dialog-box {
            position: relative;
            width: 100%;
            height: 35vh;
            background: rgba(255, 255, 255, 0.96);
            border-top: 4px solid #111;
            padding: 12px 18px;
        }

        .name-box {
            display: inline-block;
            border: 3px solid #111;
            padding: 2px 10px;
            font-size: clamp(14px, 2vw, 20px);
            margin-bottom: 8px;
        }

        .dialog-text {
            font-size: clamp(16px, 2.5vw, 24px);
            line-height: 1.5;
            min-height: 60px;
            margin-bottom: 10px;
        }

        .battle-dialog-text {
            font-size: clamp(16px, 2.5vw, 24px);
            line-height: 1.5;
            min-height: 60px;
            margin-bottom: 10px;
            text-align: center;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: clamp(16px, 2.5vw, 24px);
        }

        .choice {
            text-align: left;
            width: 250px;
        }


        .choice::before {
            content: "";
            margin-right: 8px;
        }

        .choice.selected::before {
            content: "▶";
        }

        #choices,
        #battleChoices {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #nextMark {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 12px;
            font-size: 24px;
            animation: blink 1s infinite;
            display: none;
        }
    </style>
</head>

<body>
    <div id="startScreen">
        <div class="img-wrapper">
            <img id="startImage" src="start.png" alt="Start">
        </div>
    </div>

    <div class="screen" id="titleScreen">
        <div class="img-wrapper">
            <img id="title-image" src="startscreen.png" usemap="#TitleMap" alt="Title">
            <map name="TitleMap" id="TitleMap">
                <area id="title-area1" shape="rect" coords="117,119,187,144"
                    onclick="event.preventDefault(); startGame();" alt="Start">
                <area id="title-area2" shape="rect" coords="118,165,189,188"
                    onclick="event.preventDefault(); showHtmlTitle();" alt="Title">
                <area id="title-area3" shape="rect" coords="115,207,190,234"
                    onclick="event.preventDefault(); showHowToPlay();" alt="How to Play">
                <area id="title-area4" shape="rect" coords="116,254,194,283"
                    onclick="event.preventDefault(); showSettings();" alt="Settings">
            </map>
        </div>
    </div>

    <div class="screen" id="HowToPlayScreen">
        <div class="sub-title">遊び方</div>
        <div class="content-box">
            <h3>■ ゲーム目的</h3>
            <p>主人公の「たぬき」の運命を決める選択肢型ノベルゲームです。あなたの選んだ道によって、たぬきが天国へ行けるか、あるいは恐ろしいゲームオーバーを迎えるかが決まります。</p>
            <h3>■ 操作方法（スマホ）</h3>
            <p>・画面をタップ：話を進める<br>・選択肢をタップ：決定</p>
            <h3>■ 操作方法（PC）</h3>
            <p>・ENTERキー：話を進める<br>・矢印キー（↑↓）：選択肢の移動<br>・ENTERキー：選択肢の決定</p>
        </div>
        <button class="back-btn" onclick="showHtmlTitle()">タイトルに戻る</button>
    </div>

    <div class="screen" id="SettingsScreen">
        <div class="sub-title">設定</div>
        <div class="content-box">
            <div class="setting-item">
                <span>文字送り速度</span>
                <div class="setting-btn-group">
                    <button id="speed-fast" class="config-btn" onclick="changeTextSpeed('fast')">速い</button>
                    <button id="speed-normal" class="config-btn active" onclick="changeTextSpeed('normal')">普通</button>
                    <button id="speed-slow" class="config-btn" onclick="changeTextSpeed('slow')">遅い</button>
                </div>
            </div>
            <div class="setting-item">
                <span>進捗を保存する</span>
                <div class="setting-btn-group">
                    <button id="save-on" class="config-btn" onclick="toggleSettings(true)">ON</button>
                    <button id="save-off" class="config-btn active" onclick="toggleSettings(false)">OFF</button>
                </div>
                <button onclick="flags = {}">ゲーム進捗のフラグをクリア</button>
            </div>
        </div>
        <button class="back-btn" onclick="showHtmlTitle()">タイトルに戻る</button>
    </div>

    <div class="screen" id="gameOverScreen">
        <div class="img-wrapper" id="go-img-wrapper">
            <img id="go-image" src="gameover.png" usemap="#GameOverMap" alt="Game Over">
            <map name="GameOverMap" id="GameOverMap">
                <area id="go-area1" shape="rect" coords="118,151,278,188"
                    onclick="event.preventDefault(); triggerGameOver2();" alt="Game Over 2">
                <area id="go-area2" shape="rect" coords="116,219,280,254"
                    onclick="event.preventDefault(); resetGameOverUI(); startPrologue();" alt="Start Game">
            </map>
        </div>
    </div>

    <div class="screen" id="battleScreen">
        <div class="battle-container">
            <div class="battle-dialog-box">
                <div class="battle-dialog-text" id="battleDialogText"></div>
            </div>
            <div class="battle-image-container">
                <img id="battleImage" src="" alt="Battle Image">
            </div>
            <div class="battle-items-box">
                <div class="panel-title">アイテム</div>
                <ul id="battleItemList"></ul>
            </div>
            <div class="battle-choices-box">
                <div class="choices" id="battleChoices"></div>
            </div>
        </div>
    </div>

    <div class="screen" id="gameClearScreen">
        <div class="cleartext">開発者</div>
        <div style="font-size: clamp(16px, 3vw, 30px);">ここまでしかつくってないよーん</div>
    </div>

    <div class="screen" id="gameScreen">
        <button class="save-trigger-btn" style="display: none;" onclick="manualSaveProgress()">セーブ</button>
        <div id="save-toast">進捗を保存しました！</div>
        <div class="image-container">
            <img id="gameImage" src="test.png" alt="game image">
        </div>
        <div class="dialog-box">
            <div class="name-box" id="nameBox"></div>
            <div class="dialog-text" id="dialogText"></div>
            <div class="choices" id="choices"></div>
            <div id="nextMark">▼</div>
        </div>
    </div>

    <script src="story.js"></script>
    <script>
        const scenario = getScenario();
        let currentIndex = 0;
        let selectedIndex = 0;
        let typing = false;
        let fullText = "";
        let textIndex = 0;
        let typingInterval = null;
        let typingFinished = null;

        let textSpeed = 30;
        let goBaseWidth = 431;
        let goBaseHeight = 600;

        let saveProgressEnabled = true;

        let flags = {};

        const nameBox = document.getElementById("nameBox");
        const dialogText = document.getElementById("dialogText");
        const choicesContainer = document.getElementById("choices");
        const nextMark = document.getElementById("nextMark");
        const gameImage = document.getElementById("gameImage");
        const battleScreen = document.getElementById("battleScreen");
        const battleImage = document.getElementById("battleImage");
        const battleDialogText = document.getElementById("battleDialogText");
        const battleChoicesContainer = document.getElementById("battleChoices");
        const battleItemList = document.getElementById("battleItemList");

        let currentSegments = [];
        let justSkipped = false;
        let message2Timeout = null;

        function findLabel(labelName) {
            const index = scenario.findIndex(s => s.label === labelName);
            if (index === -1) {
                console.error("Label not found:", labelName);
            }
            return index;
        }

        function checkCondition(condition) {
            if (!condition) return true;

            if (condition.startsWith("!")) {
                const flagName = condition.slice(1);
                return !flags[flagName];
            }

            return !!flags[condition];
        }

        function saveButtonNone() {
            const saveBtn = document.querySelector(".save-trigger-btn");
            if (saveBtn) {
                saveBtn.style.display = saveProgressEnabled ? "block" : "none";
            }
        }

        function manualSaveProgress() {
            if (!saveProgressEnabled) {
                saveButtonNone();
                return;
            }
            localStorage.setItem("tanuki_game_progress", currentIndex);
            const toast = document.getElementById("save-toast");
            if (toast) {
                toast.style.display = "block";
                setTimeout(() => {
                    toast.style.display = "none";
                }, 2000);
            }
        }

        function showHtmlTitle() {
            hideAllScreens();
            document.getElementById("titleScreen").style.display = "flex";
            setTimeout(resizeAllMaps, 50);
        }

        function showGameOver() {
            hideAllScreens();
            const goScreen = document.getElementById("gameOverScreen");
            if (goScreen) {
                goScreen.style.display = "flex";
                resetGameOverUI();
            }
        }

        function showGameClear() {
            hideAllScreens();
            document.getElementById("gameClearScreen").style.display = "flex";
            if (saveProgressEnabled) {
                localStorage.removeItem("tanuki_game_progress");
            }
        }

        function showHowToPlay() {
            hideAllScreens();
            document.getElementById("HowToPlayScreen").style.display = "flex";
        }

        function showSettings() {
            hideAllScreens();
            loadSettingsAndProgress();
            document.getElementById("SettingsScreen").style.display = "flex";
        }

        function changeTextSpeed(speed) {
            const speedFast = document.getElementById("speed-fast");
            const speedNormal = document.getElementById("speed-normal");
            const speedSlow = document.getElementById("speed-slow");

            if (speedFast && speedNormal && speedSlow) {
                speedFast.classList.remove("active");
                speedNormal.classList.remove("active");
                speedSlow.classList.remove("active");

                if (speed === 'fast') {
                    textSpeed = 10;
                    speedFast.classList.add("active");
                    localStorage.setItem("tanuki_text_speed", "10");
                } else if (speed === 'slow') {
                    textSpeed = 60;
                    speedSlow.classList.add("active");
                    localStorage.setItem("tanuki_text_speed", "60");
                } else {
                    textSpeed = 30;
                    speedNormal.classList.add("active");
                    localStorage.setItem("tanuki_text_speed", "30");
                }
            }
        }

        function toggleSettings(enabled) {
            saveProgressEnabled = enabled;

            const btnOn = document.getElementById("save-on");
            const btnOff = document.getElementById("save-off");

            if (btnOn && btnOff) {
                btnOn.classList.remove("active");
                btnOff.classList.remove("active");

                if (enabled) {
                    btnOn.classList.add("active");
                    localStorage.setItem("tanuki_save_enabled", "true");

                    const gameScreen = document.getElementById("gameScreen");
                    if (gameScreen && gameScreen.style.display === "flex") {
                        saveCurrentProgress();
                    }
                } else {
                    btnOff.classList.add("active");
                    localStorage.setItem("tanuki_save_enabled", "false");
                    localStorage.removeItem("tanuki_game_progress");
                }
            }
            saveButtonNone();
        }

        function loadSettingsAndProgress() {
            const btnOn = document.getElementById("save-on");
            const btnOff = document.getElementById("save-off");

            if (btnOn && btnOff) {
                btnOn.classList.remove("active");
                btnOff.classList.remove("active");

                const savedEnabled = localStorage.getItem("tanuki_save_enabled");
                if (savedEnabled === "true") {
                    saveProgressEnabled = true;
                    btnOn.classList.add("active");
                } else {
                    saveProgressEnabled = false;
                    btnOff.classList.add("active");
                    localStorage.setItem("tanuki_save_enabled", "false");
                }
            }

            const speedFast = document.getElementById("speed-fast");
            const speedNormal = document.getElementById("speed-normal");
            const speedSlow = document.getElementById("speed-slow");

            if (speedFast && speedNormal && speedSlow) {
                speedFast.classList.remove("active");
                speedNormal.classList.remove("active");
                speedSlow.classList.remove("active");

                const savedSpeed = localStorage.getItem("tanuki_text_speed");
                if (savedSpeed !== null) {
                    textSpeed = parseInt(savedSpeed, 10);
                } else {
                    textSpeed = 30;
                }

                if (textSpeed === 10) {
                    speedFast.classList.add("active");
                } else if (textSpeed === 60) {
                    speedSlow.classList.add("active");
                } else {
                    speedNormal.classList.add("active");
                }
            }
            saveButtonNone();
        }

        function saveCurrentProgress() {
            if (saveProgressEnabled) {
                localStorage.setItem("tanuki_game_progress", currentIndex);
            }
        }

        function hideAllScreens() {
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("titleScreen").style.display = "none";
            if (document.getElementById("startScreen")) document.getElementById("startScreen").style.display = "none";
            if (document.getElementById("gameOverScreen")) document.getElementById("gameOverScreen").style.display = "none";
            if (document.getElementById("gameClearScreen")) document.getElementById("gameClearScreen").style.display = "none";
            if (document.getElementById("HowToPlayScreen")) document.getElementById("HowToPlayScreen").style.display = "none";
            if (document.getElementById("SettingsScreen")) document.getElementById("SettingsScreen").style.display = "none";
            if (battleScreen) battleScreen.style.display = "none";
        }

        function calculateMapCoords(imgId, baseWidth, baseHeight, coordsData) {
            const img = document.getElementById(imgId);
            if (!img || img.clientWidth === 0 || !img.getAttribute("usemap")) return;

            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;

            const containerRatio = containerWidth / containerHeight;
            const baseRatio = baseWidth / baseHeight;

            let scale = 1;
            let actualImgWidth = containerWidth;
            let actualImgHeight = containerHeight;

            if (containerRatio > baseRatio) {
                scale = containerHeight / baseHeight;
                actualImgWidth = baseWidth * scale;
            } else {
                scale = containerWidth / baseWidth;
                actualImgHeight = baseHeight * scale;
            }

            const offsetX = (containerWidth - actualImgWidth) / 2;
            const offsetY = (containerHeight - actualImgHeight) / 2;

            for (let id in coordsData) {
                const area = document.getElementById(id);
                if (area) {
                    const coords = coordsData[id];
                    const scaledCoords = [
                        Math.round(coords[0] * scale + offsetX),
                        Math.round(coords[1] * scale + offsetY),
                        Math.round(coords[2] * scale + offsetX),
                        Math.round(coords[3] * scale + offsetY)
                    ];
                    area.coords = scaledCoords.join(",");
                }
            }
        }

        function resizeAllMaps() {
            calculateMapCoords("title-image", 320, 399, {
                "title-area1": [117, 119, 187, 144],
                "title-area2": [118, 165, 189, 188],
                "title-area3": [115, 207, 190, 234],
                "title-area4": [116, 254, 194, 283]
            });
            calculateMapCoords("go-image", goBaseWidth, goBaseHeight, {
                "go-area1": [118, 151, 278, 188],
                "go-area2": [116, 219, 280, 254]
            });
        }

        window.addEventListener("resize", resizeAllMaps);
        window.addEventListener("orientationchange", () => {
            setTimeout(resizeAllMaps, 200);
        });

        function resetGameOverUI() {
            const currentImg = document.getElementById("go-image");
            if (!currentImg) return;

            goBaseWidth = 431;
            goBaseHeight = 600;

            currentImg.src = "gameover.png";
            currentImg.setAttribute("usemap", "#GameOverMap");

            setTimeout(resizeAllMaps, 50);
        }

        function triggerGameOver2() {
            const currentImg = document.getElementById("go-image");
            if (currentImg) {
                let tempImg = new Image();
                tempImg.onload = () => {
                    goBaseWidth = 422;
                    goBaseHeight = 951;
                    currentImg.src = tempImg.src;
                    currentImg.removeAttribute("usemap");
                };
                tempImg.src = "gameover2.png";
            }
        }

        function clearUI() {
            nameBox.textContent = "";
            dialogText.innerHTML = "";
            choicesContainer.innerHTML = "";
            nextMark.style.display = "none";
        }

        function typeText(text, targetDialog = dialogText, targetNext = nextMark) {
            clearInterval(typingInterval);
            typing = true;
            justSkipped = false;
            fullText = text;
            textIndex = 0;
            targetDialog.innerHTML = "";
            if (targetNext) targetNext.style.display = "none";

            currentSegments = [];
            const regex = /\[style=['"]([^'"]*?)['"]\]([^\]]*?)\]/g;

            let lastIndex = 0;
            let match;

            while ((match = regex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    const plainText = text.substring(lastIndex, match.index);
                    for (let char of plainText) {
                        currentSegments.push({ type: 'plain', value: char });
                    }
                }
                currentSegments.push({
                    type: 'style',
                    style: match[1],
                    value: match[2]
                });
                lastIndex = regex.lastIndex;
            }

            if (lastIndex < text.length) {
                const plainText = text.substring(lastIndex);
                for (let char of plainText) {
                    currentSegments.push({ type: 'plain', value: char });
                }
            }

            typingInterval = setInterval(() => {
                if (textIndex >= currentSegments.length) {
                    finishTyping(targetNext);
                    return;
                }

                const currentSegment = currentSegments[textIndex];

                if (currentSegment.type === 'plain') {
                    targetDialog.innerHTML += currentSegment.value === "\n" ? "<br>" : currentSegment.value;
                } else if (currentSegment.type === 'style') {
                    const formattedValue = currentSegment.value.replace(/\n/g, "<br>");
                    targetDialog.innerHTML += `<span style="${currentSegment.style}">${formattedValue}</span>`;
                }

                textIndex++;

                if (textIndex >= currentSegments.length) {
                    finishTyping(targetNext);
                }
            }, textSpeed);
        }

        function finishTyping(targetNext = nextMark) {
            clearInterval(typingInterval);
            if (message2Timeout) {
                clearTimeout(message2Timeout);
            }
            typing = false;

            const current = scenario[currentIndex];

            if (
                current.type === "message1" ||
                current.type === "gameOver" ||
                current.type === "gameClear" ||
                current.type === "cimg" ||
                current.type === "battle"
            ) {
                if (targetNext) targetNext.style.display = "block";
            }

            if (typeof typingFinished === "function") {
                typingFinished();
                typingFinished = null;
            }

            if (current.type === "message2") {
                message2Timeout = setTimeout(() => {
                    currentIndex++;
                    saveCurrentProgress();
                    nextEvent();
                }, 250);
            }
        }

        function renderChoices(choices, container = choicesContainer) {
            container.innerHTML = "";
            choices.forEach((choice, index) => {
                const div = document.createElement("div");
                div.className = "choice";
                div.style.cursor = "pointer";
                if (index === selectedIndex) {
                    div.classList.add("selected");
                    div.textContent = "　" + choice.text;
                } else {
                    div.textContent = "　　" + choice.text;
                }
                div.addEventListener("click", () => {
                    selectedIndex = index;
                    renderChoices(choices, container);
                    setTimeout(() => {
                        handleEnter();
                    }, 100);
                });
                container.appendChild(div);
            });
        }

        function skipTyping() {
            clearInterval(typingInterval);

            let fullHTML = "";
            for (let segment of currentSegments) {
                if (segment.type === 'plain') {
                    fullHTML += segment.value === "\n" ? "<br>" : segment.value;
                } else if (segment.type === 'style') {
                    const formattedValue = segment.value.replace(/\n/g, "<br>");
                    fullHTML += `<span style="${segment.style}">${formattedValue}</span>`;
                }
            }

            dialogText.innerHTML = fullHTML;
            textIndex = currentSegments.length;

            finishTyping();
            setTimeout(() => {
                justSkipped = false;
            }, 200);
        }

        function handleEnter() {
            if (justSkipped) {
                return;
            }

            if (typing) {
                justSkipped = true;
                skipTyping();
                return;
            }

            const current = scenario[currentIndex];
            if (!current) return;

            if (current.type === "gameOver") {
                nextMark.style.display = "none";
                showGameOver();
                return;
            }
            if (current.type === "gameClear") {
                nextMark.style.display = "none";
                showGameClear();
                return;
            }
            if (current.type === "message1" || current.type === "cimg") {
                nextMark.style.display = "none";
                currentIndex++;
                saveCurrentProgress();
                nextEvent();
                return;
            }

            if (current.type === "choice" || current.type === "battle") {
                if (!current.choices || current.choices.length === 0) return;

                const selected = current.choices[selectedIndex];
                if (!selected) return;

                if (selected.jump === "htmlTitle" || selected.jump === "title") {
                    showHtmlTitle();
                    return;
                }
                if (typeof selected.jump === "number") {
                    currentIndex = selected.jump;
                } else {
                    const jumpIndex = findLabel(selected.jump);
                    if (jumpIndex === -1) {
                        console.error("Jump label missing:", selected.jump);
                        return;
                    }
                    currentIndex = jumpIndex;
                }
                selectedIndex = 0;
                saveCurrentProgress();
                nextEvent();
            }
        }

        function nextEvent() {
            while (true) {
                const current = scenario[currentIndex];
                if (!current) {
                    console.error("Scenario out:", currentIndex);
                    return;
                }

                if (current.label) {
                    currentIndex++;
                    continue;
                }

                if (current.if && !checkCondition(current.if)) {
                    currentIndex++;
                    continue;
                }

                if (current.set) {
                    flags[current.set] = true;
                }

                if (current.type === "battle") {
                    hideAllScreens();
                    battleScreen.style.display = "flex";

                    if (current.image) battleImage.src = current.image;

                    battleItemList.innerHTML = "";
                    if (current.items && current.items.length > 0) {
                        current.items.forEach(item => {
                            const li = document.createElement("li");
                            li.textContent = "・" + item;
                            battleItemList.appendChild(li);
                        });
                    } else {
                        battleItemList.innerHTML = "<li>なし</li>";
                    }

                    typeText(current.text || "", battleDialogText, battleNextMark);
                    typingFinished = () => {
                        if (current.choices) {
                            renderChoices(current.choices, battleChoicesContainer);
                        }
                    };
                    return;
                }

                if (document.getElementById("gameScreen").style.display !== "flex") {
                    hideAllScreens();
                    document.getElementById("gameScreen").style.display = "flex";
                }

                if (current.image) {
                    gameImage.src = current.image;
                }
                if (current.type === "none") {
                    clearUI();
                    currentIndex++;
                    continue;
                }
                if (current.type === "title") {
                    showHtmlTitle();
                    return;
                }
                if (current.type === "message1" || current.type === "message2" || current.type === "gameOver" || current.type === "gameClear" || current.type === "cimg") {
                    nameBox.textContent = current.name || "";
                    choicesContainer.innerHTML = "";
                    typeText(current.text || "");
                    return;
                }
                if (current.type === "choice") {
                    nameBox.textContent = current.name || "";
                    nextMark.style.display = "none";
                    typeText(current.text || "");
                    typingFinished = () => {
                        renderChoices(current.choices);
                    }
                    return;
                }

                currentIndex++;
            }
        }

        function startGame() {
            hideAllScreens();
            document.getElementById("gameScreen").style.display = "flex";

            const savedProgress = localStorage.getItem("tanuki_game_progress");
            if (saveProgressEnabled && savedProgress !== null) {
                currentIndex = parseInt(savedProgress, 10);
                selectedIndex = 0;
                nextEvent();
                return;
            }

            const startIndex = findLabel("startGame");
            if (startIndex === -1) {
                console.error("startGame label missing");
                return;
            }
            currentIndex = startIndex;
            selectedIndex = 0;

            saveCurrentProgress();
            nextEvent();
        }

        function startPrologue() {
            hideAllScreens();
            document.getElementById("gameScreen").style.display = "flex";
            const startIndex = findLabel("prologue");
            if (startIndex === -1) {
                console.error("prologue label missing");
                return;
            }
            currentIndex = startIndex;
            selectedIndex = 0;
            if (saveProgressEnabled) {
                saveCurrentProgress();
            }
            nextEvent();
        }

        document.addEventListener("keydown", e => {
            const isStart = document.getElementById("startScreen")?.style.display === "flex";
            const isTitle = document.getElementById("titleScreen").style.display === "flex";
            const isGameOver = document.getElementById("gameOverScreen")?.style.display === "flex";
            const isGameClear = document.getElementById("gameClearScreen")?.style.display === "flex";
            const isHowTo = document.getElementById("HowToPlayScreen").style.display === "flex";
            const isSettings = document.getElementById("SettingsScreen").style.display === "flex";

            if (isStart) {
                if (e.key === "Enter") startPrologue();
                return;
            }
            if (isGameOver) {
                if (e.key === "ArrowUp") triggerGameOver2();
                return;
            }
            if (isTitle || isGameClear || isHowTo || isSettings) {
                if (e.key === "Enter" && isTitle) startGame();
                return;
            }

            const current = scenario[currentIndex];

            if (current && current.type === "cimg" && current.key) {
                if (e.key === current.key) {
                    gameImage.src = current.image2;
                }
            }

            if (current && (current.type === "choice" || current.type === "battle")) {
                const container = current.type === "battle" ? battleChoicesContainer : choicesContainer;
                if (current.choices && current.choices.length > 0) {
                    if (e.key === "ArrowDown") {
                        selectedIndex++;
                        if (selectedIndex >= current.choices.length) selectedIndex = 0;
                        renderChoices(current.choices, container);
                    }
                    if (e.key === "ArrowUp") {
                        selectedIndex--;
                        if (selectedIndex < 0) selectedIndex = current.choices.length - 1;
                        renderChoices(current.choices, container);
                    }
                }
            }

            if (e.key === "Enter") {
                handleEnter();
            }
        });

        window.addEventListener("load", () => {
            hideAllScreens();
            loadSettingsAndProgress();

            if (saveProgressEnabled) {
                const savedIndex = localStorage.getItem("tanuki_game_progress");
                if (savedIndex !== null) {
                    currentIndex = parseInt(savedIndex, 10);
                }
            }

            if (nextMark) {
                nextMark.addEventListener("click", () => {
                    handleEnter();
                });
                nextMark.style.cursor = "pointer";
            }

            const titleImg = document.getElementById("title-image");
            if (titleImg) {
                if (titleImg.complete) { resizeAllMaps(); }
                else { titleImg.addEventListener("load", resizeAllMaps); }
            }
            const goImg = document.getElementById("go-image");
            if (goImg) {
                if (goImg.complete) { resizeAllMaps(); }
                else { goImg.addEventListener("load", resizeAllMaps); }
            }

            const startScreen = document.getElementById("startScreen");
            if (startScreen) {
                startScreen.style.display = "flex";
                startScreen.addEventListener("click", () => {
                    startPrologue();
                }, { once: true });
            } else {
                startPrologue();
            }
        });
    </script>
