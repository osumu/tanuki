<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>たぬきの運命</title>
    <style>
        @font-face {
            font-family: 'PixelMplus';
            src: url('PixelMplus12-Regular.ttf') format('truetype');
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #111;
            font-family: 'PixelMplus', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            width: 100vw;
            height: 100vh;
        }

        #startScreen {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }

        #titleScreen,
        #gameOverScreen,
        #gameClearScreen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #ffffff, #dddddd);
        }


        .game-title {
            font-size: clamp(32px, 6vw, 72px);
            margin-bottom: 30px;
        }

        .overtext {
            font-size: clamp(200px, 174vw, 240px);
            margin-bottom: 30px;
            color: #ff0000;
            user-select: none;
        }

        .cleartext {
            font-size: clamp(32px, 6vw, 72px);
            margin-bottom: 30px;
            color: #7d7d05;
        }

        .start-text {
            font-size: clamp(16px, 3vw, 30px);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        #gameScreen {
            display: none;
            flex-direction: column;
        }

        .image-container {
            width: 100%;
            height: 65vh;
            background: #eaeaea;
            border-bottom: 4px solid #111;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .dialog-box {
            position: relative;
            width: 100%;
            height: 35vh;
            background: rgba(255, 255, 255, 0.96);
            border-top: 4px solid #111;
            padding: 12px 18px;
        }

        .name-box {
            display: inline-block;
            border: 3px solid #111;
            padding: 2px 10px;
            font-size: clamp(14px, 2vw, 20px);
            margin-bottom: 8px;
        }

        .dialog-text {
            font-size: clamp(16px, 2.5vw, 24px);
            line-height: 1.5;
            min-height: 60px;
            margin-bottom: 10px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: clamp(16px, 2.5vw, 24px);
        }

        .choice::before {
            content: "　";
            margin-right: 8px;
        }

        .choice.selected::before {
            content: "▶";
        }

        #nextMark {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 12px;
            font-size: 24px;
            animation: blink 1s infinite;
            display: none;
        }
    </style>
</head>

<body>
    <div id="startScreen">
        <img id="startImage" src="start.png" alt="Start" style="
        width: 100%; 
        height: 100%; 
        object-fit: contain;
    ">
    </div>
    <div class="screen" id="titleScreen">
        <div class="game-title">たぬきの運命</div>
        <div class="start-text">ENTERキーでスタート</div>
    </div>
    <div class="screen" id="gameOverScreen"
        style="background-color:#2b2b2b;background-image:url(tnkgameover.png);background-size:contain;background-position:center;background-repeat:2;">
        <div class="overtext">GAME</div>
        <div class="overtext">OVER</div>
    </div>
    <div class="screen" id="gameClearScreen">
        <div class="cleartext">GAME CLEAR</div>
        <div style="font-size: clamp(16px, 3vw, 30px);">たぬきは無事天国へ行くことができた！</div>
    </div>
    <div class="screen" id="gameScreen">
        <div class="image-container">
            <img id="gameImage" src="test.png" alt="game image">
        </div>
        <div class="dialog-box">
            <div class="name-box" id="nameBox"></div>
            <div class="dialog-text" id="dialogText"></div>
            <div class="choices" id="choices"></div>
            <div id="nextMark">▼</div>
        </div>
    </div>
    <script src="story.js"></script>
    <script>
        const scenario = getScenario();
        let currentIndex = 0;
        let selectedIndex = 0;
        let typing = false;
        let fullText = "";
        let textIndex = 0;
        let typingInterval = null;

        const nameBox = document.getElementById("nameBox");
        const dialogText = document.getElementById("dialogText");
        const choicesContainer = document.getElementById("choices");
        const nextMark = document.getElementById("nextMark");
        const gameImage = document.getElementById("gameImage");

        function findLabel(labelName) {
            const index = scenario.findIndex(s => s.label === labelName);
            if (index === -1) {
                console.error("Label not found:", labelName);
            }
            return index;
        }

        function showHtmlTitle() {
            hideAllScreens();
            document.getElementById("titleScreen").style.display = "flex";
        }

        function showGameOver() {
            hideAllScreens();
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function showGameClear() {
            hideAllScreens();
            document.getElementById("gameClearScreen").style.display = "flex";
        }

        function hideAllScreens() {
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("titleScreen").style.display = "none";
            if (document.getElementById("startScreen")) document.getElementById("startScreen").style.display = "none";
            if (document.getElementById("gameOverScreen")) document.getElementById("gameOverScreen").style.display = "none";
            if (document.getElementById("gameClearScreen")) document.getElementById("gameClearScreen").style.display = "none";
        }

        function clearUI() {
            nameBox.textContent = "";
            dialogText.innerHTML = "";
            choicesContainer.innerHTML = "";
            nextMark.style.display = "none";
        }

        function typeText(text) {
            clearInterval(typingInterval);
            typing = true;
            fullText = text;
            textIndex = 0;
            dialogText.innerHTML = "";
            nextMark.style.display = "none";
            typingInterval = setInterval(() => {
                const char = fullText[textIndex];
                dialogText.innerHTML += char === "\n" ? "<br>" : char;
                textIndex++;
                if (textIndex >= fullText.length) {
                    clearInterval(typingInterval);
                    typing = false;
                    const current = scenario[currentIndex];
                    if (current.type === "message1" || current.type === "gameOver" || current.type === "gameClear" || current.type === "cimg") {
                        nextMark.style.display = "block";
                    }
                    if (current.type === "message2") {
                        setTimeout(() => {
                            currentIndex++;
                            nextEvent();
                        }, 250);
                    }
                }
            }, 30);
        }

        function renderChoices(choices) {
            choicesContainer.innerHTML = "";
            choices.forEach((choice, index) => {
                const div = document.createElement("div");
                div.className = "choice";
                if (index === selectedIndex) {
                    div.classList.add("selected");
                    div.textContent = " " + choice.text;
                } else {
                    div.textContent = " " + choice.text;
                }
                choicesContainer.appendChild(div);
            });
        }

        function nextEvent() {
            while (true) {
                const current = scenario[currentIndex];
                if (!current) {
                    console.error("Scenario out:", currentIndex);
                    return;
                }
                if (current.label) {
                    currentIndex++;
                    continue;
                }
                if (current.image) {
                    gameImage.src = current.image;
                }
                if (current.type === "none") {
                    clearUI();
                    currentIndex++;
                    continue;
                }
                if (current.type === "title") {
                    showHtmlTitle();
                    return;
                }

                if (current.type === "message1" || current.type === "message2" || current.type === "gameOver" || current.type === "gameClear" || current.type === "cimg") {
                    nameBox.textContent = current.name || "";
                    choicesContainer.innerHTML = "";
                    typeText(current.text || "");
                    return;
                }
                if (current.type === "choice") {
                    nameBox.textContent = current.name || "";
                    dialogText.innerHTML = (current.text || "").replace(/\n/g, "<br>");
                    nextMark.style.display = "none";
                    renderChoices(current.choices);
                    return;
                }
                currentIndex++;
            }
        }

        function startGame() {
            hideAllScreens();
            document.getElementById("gameScreen").style.display = "flex";

            const startIndex = findLabel("startGame");
            if (startIndex === -1) {
                console.error("startGame label missing");
                return;
            }
            currentIndex = startIndex;
            selectedIndex = 0;
            nextEvent();
        }

        function startPrologue() {
            hideAllScreens();
            document.getElementById("gameScreen").style.display = "flex";

            const startIndex = findLabel("prologue");
            if (startIndex === -1) {
                console.error("prologue label missing");
                return;
            }
            currentIndex = startIndex;
            selectedIndex = 0;
            nextEvent();
        }

        function handleEnter() {
            if (typing) {
                clearInterval(typingInterval);
                dialogText.innerHTML = fullText.replace(/\n/g, "<br>");
                typing = false;
                const current = scenario[currentIndex];
                if (current.type === "message1" || current.type === "gameOver" || current.type === "gameClear" || current.type === "cimg") {
                    nextMark.style.display = "block";
                }
                if (current.type === "message2") {
                    setTimeout(() => {
                        currentIndex++;
                        nextEvent();
                    }, 200);
                }
                return;
            }

            const current = scenario[currentIndex];

            if (current.type === "gameOver") {
                nextMark.style.display = "none";
                showGameOver();
                return;
            }
            if (current.type === "gameClear") {
                nextMark.style.display = "none";
                showGameClear();
                return;
            }
            if (current.type === "message1" || current.type === "cimg") {
                nextMark.style.display = "none";
                dialogText.innerHTML = fullText.replace(/\n/g, "<br>");
                currentIndex++;
                nextEvent();
                return;
            }
            if (current.type === "choice") {
                const selected = current.choices[selectedIndex];
                if (selected.jump === "htmlTitle" || selected.jump === "title") {
                    showHtmlTitle();
                    return;
                }
                if (typeof selected.jump === "number") {
                    currentIndex = selected.jump;
                } else {
                    const jumpIndex = findLabel(selected.jump);
                    if (jumpIndex === -1) {
                        console.error("Jump label missing:", selected.jump);
                        return;
                    }
                    currentIndex = jumpIndex;
                }
                selectedIndex = 0;
                nextEvent();
            }
        }

        document.addEventListener("keydown", e => {
            const isStart = document.getElementById("startScreen")?.style.display === "flex";
            const isTitle = document.getElementById("titleScreen").style.display === "flex";
            const isGameOver = document.getElementById("gameOverScreen")?.style.display === "flex";
            const isGameClear = document.getElementById("gameClearScreen")?.style.display === "flex";

            if (isStart) return;

            if (isTitle || isGameOver || isGameClear) {
                if (e.key === "Enter") {
                    startGame();
                }
                return;
            }

            const current = scenario[currentIndex];

            if (current && current.type === "cimg" && current.key) {
                if (e.key === current.key) {
                    gameImage.src = current.image2;
                }
            }

            if (current && current.type === "choice") {
                if (e.key === "ArrowDown") {
                    selectedIndex++;
                    if (selectedIndex >= current.choices.length) {
                        selectedIndex = 0;
                    }
                    renderChoices(current.choices);
                }
                if (e.key === "ArrowUp") {
                    selectedIndex--;
                    if (selectedIndex < 0) {
                        selectedIndex = current.choices.length - 1;
                    }
                    renderChoices(current.choices);
                }
            }
            if (e.key === "Enter") {
                handleEnter();
            }
        });

        window.addEventListener("load", () => {
            hideAllScreens();
            if (nextMark) {
                nextMark.addEventListener("click", () => {
                    handleEnter();
                });
                nextMark.style.cursor = "pointer";
            }

            const startScreen = document.getElementById("startScreen");
            if (startScreen) {
                startScreen.style.display = "flex";
                startScreen.addEventListener("click", () => {
                    startPrologue();
                }, { once: true });
            } else {
                startPrologue();
            }
        });
    </script>
</body>

</html>
