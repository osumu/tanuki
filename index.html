<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG選択ゲーム</title>

    <style>
        @font-face {
            font-family: 'PixelMplus';
            src: url('PixelMplus12-Regular.ttf') format('truetype');
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #111;
            font-family: 'PixelMplus', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 共通 */
        .screen {
            width: 100vw;
            height: 100vh;
        }

        /* タイトル */
        #titleScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(to bottom, #ffffff, #dddddd);
        }

        .game-title {
            font-size: clamp(32px, 6vw, 72px);
            margin-bottom: 30px;
        }

        .start-text {
            font-size: clamp(16px, 3vw, 30px);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        /* ゲーム */
        #gameScreen {
            display: none;
            flex-direction: column;
        }

        /* 画像 */
        .image-container {
            width: 100%;
            height: 65vh;

            background: #eaeaea;

            border-bottom: 4px solid #111;
        }

        .image-container img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        /* ダイアログ */
        .dialog-box {
            position: relative;

            width: 100%;
            height: 35vh;

            background: rgba(255, 255, 255, 0.96);

            border-top: 4px solid #111;

            padding: 12px 18px;
        }

        /* 名前 */
        .name-box {
            display: inline-block;

            border: 3px solid #111;

            padding: 2px 10px;

            font-size: clamp(14px, 2vw, 20px);

            margin-bottom: 8px;
        }

        /* テキスト */
        .dialog-text {
            font-size: clamp(16px, 2.5vw, 24px);

            line-height: 1.5;

            min-height: 60px;

            margin-bottom: 10px;
        }

        /* 選択肢 */
        .choices {
            display: flex;
            flex-direction: column;

            gap: 4px;

            font-size: clamp(16px, 2.5vw, 24px);
        }

        .choice::before {
            content: "　";
            margin-right: 8px;
        }

        .choice.selected::before {
            content: "▶";
        }

        #nextMark {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 12px;
            font-size: 24px;
            animation: blink 1s infinite;
            display: none;
        }
    </style>
</head>

<body>

    <!-- タイトル -->
    <div class="screen" id="titleScreen">

        <div class="game-title">
            たぬきの運命
        </div>

        <div class="start-text">
            ENTERキーでスタート
        </div>

    </div>

    <!-- ゲーム -->
    <div class="screen" id="gameScreen">

        <!-- 画像 -->
        <div class="image-container">

            <img id="gameImage" src="test.png" alt="game image">

        </div>

        <!-- ダイアログ -->
        <div class="dialog-box">

            <div class="name-box" id="nameBox"></div>

            <div class="dialog-text" id="dialogText"></div>

            <div class="choices" id="choices"></div>

            <div id="nextMark">
                ▼
            </div>

        </div>

    </div>

    <script src="story.js"></script>
    <script src="main.js"></script>

</body>

</html>
